<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/main.css">
    <script src="script/game.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Rock - Paper - Scissor</h1>
    </header>

   <div class="choices">
        <button data-choice="rock">👊</button>
        <button data-choice="paper">✋</button>
        <button data-choice="scissors">✌️</button>
   </div> 

   <div class="playerDisplay">PLAYER: </div>
   <div class="computerDisplay">COMPUTER: </div>
   <div class="resultDisplay"></div>

   <div class="scoreDisplay">Player score:
        <span class="playerScoreDisplay">0</span>
   </div>
   <div class="scoreDisplay">Computer score:
        <span class="computerScoreDisplay">0</span>
   </div>
   
    
</body>
</html>
